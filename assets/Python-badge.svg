
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="60">
  <defs>
    <linearGradient id="boxGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="2" />
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.5" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>
  <style>
    .box {
      fill: url(#boxGradient);
      stroke: #FFD63E;
      stroke-width: 2.5;
      rx: 15;
      filter: url(#innerShadow) drop-shadow(0 0 12px #FFD63E) drop-shadow(0 0 24px #FFD63E);
      animation: pulse 4s infinite cubic-bezier(0.4,0,0.2,1);
    }
    .icon-glow {
      filter: drop-shadow(0 0 8px #FFD63E) drop-shadow(0 0 16px #FFD63E);
      animation: iconPulse 4s infinite cubic-bezier(0.4,0,0.2,1);
    }
    .label, .score {
      fill: white;
      font-size: 14px;
      font-family: 'Verdana';
      dominant-baseline: middle;
      text-anchor: middle;
    }
    .label { animation: fadeInLeft 2s ease-out; }
    .score { animation: fadeInRight 2s ease-out; }

    @keyframes pulse {
      0%, 100% {
        filter: url(#innerShadow) drop-shadow(0 0 12px #FFD63E) drop-shadow(0 0 24px #FFD63E);
      }
      50% {
        filter: url(#innerShadow) drop-shadow(0 0 32px #FFD63E) drop-shadow(0 0 48px #FFD63E);
      }
    }
    @keyframes iconPulse {
      0%, 100% {
        filter: drop-shadow(0 0 8px #FFD63E) drop-shadow(0 0 16px #FFD63E);
      }
      50% {
        filter: drop-shadow(0 0 24px #FFD63E) drop-shadow(0 0 32px #FFD63E);
      }
    }
    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>

  <rect x="0" y="0" width="260" height="60" rx="12" class="box"/>
  <text x="45" y="30" class="label">Python</text>
  <image href="data:image/png;base64," x="110" y="13" width="35" height="35" class="icon-glow"/>
  <text x="210" y="30" class="score">7/10</text>
</svg>
