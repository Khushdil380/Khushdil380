
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="60">
  <defs>
    <linearGradient id="boxGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E4405F">
        <animate attributeName="stop-color" values="#E4405F;#FCAF45;#405DE6;#E4405F" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#405DE6">
        <animate attributeName="stop-color" values="#405DE6;#E4405F;#FCAF45;#405DE6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="iconGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .box {
      fill: url(#boxGradient);
      rx: 16;
      stroke: #E4405F;
      stroke-width: 2;
      filter: drop-shadow(0 0 12px #E4405F88);
      animation: boxPulse 4s infinite alternate;
    }
    .divider {
      stroke: #fff8;
      stroke-width: 1.5;
      opacity: 0.5;
    }
    .label {
      fill: #fff;
      font-size: 20px;
      font-family: 'Segoe UI', Verdana, sans-serif;
      font-weight: bold;
      dominant-baseline: middle;
      text-anchor: middle;
      letter-spacing: 1px;
      filter: drop-shadow(0 1px 2px #0008);
      animation: textFade 2s infinite alternate;
    }
    .icon {
      filter: url(#iconGlow) drop-shadow(0 0 10px #E4405F);
      animation: iconGlow 2.5s infinite alternate;
    }
    @keyframes boxPulse {
      0% { filter: drop-shadow(0 0 12px #E4405F88); }
      100% { filter: drop-shadow(0 0 28px #E4405Fcc); }
    }
    @keyframes iconGlow {
      0% { filter: url(#iconGlow) drop-shadow(0 0 10px #E4405F); }
      100% { filter: url(#iconGlow) drop-shadow(0 0 22px #E4405F); }
    }
    @keyframes textFade {
      0% { opacity: 1; }
      100% { opacity: 0.85; }
    }
    a:hover .box {
      filter: drop-shadow(0 0 32px #E4405F);
    }
    a:hover .icon {
      filter: url(#iconGlow) drop-shadow(0 0 32px #E4405F);
    }
  </style>
  <a href="https://github.com/Khushdil380" target="_blank">
    <rect x="0" y="0" width="260" height="60" rx="16" class="box"/>
    <line x1="170" y1="10" x2="170" y2="50" class="divider"/>
    <text x="85" y="30" class="label">Github</text>
    <image href="data:image/png;base64," x="197" y="12" width="36" height="36" class="icon"/>
  </a>
</svg>
