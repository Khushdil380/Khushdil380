<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="80" 
     viewBox="0 0 300 80">
  
  
    <defs>
      <!-- Icon breathing glow filter -->
      <filter id="icon-breathing-glow-GitHub" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
        <feMorphology operator="dilate" radius="2" result="thickened"/>
        <feGaussianBlur stdDeviation="15" in="thickened" result="bigBlur"/>
        <feFlood flood-color="#ffffff" result="glowColor"/>
        <feComposite in="glowColor" in2="bigBlur" operator="in" result="coloredGlow"/>
        <feMerge>
          <feMergeNode in="coloredGlow"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
        <animate attributeName="stdDeviation" values="8;20;8" dur="3s" repeatCount="indefinite"/>
      </filter>
      
      <!-- Border breathing glow filter -->
      <filter id="border-glow-GitHub" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="borderBlur"/>
        <feFlood flood-color="#181717" flood-opacity="0.6" result="borderColor"/>
        <feComposite in="borderColor" in2="borderBlur" operator="in" result="borderGlow"/>
        <feMerge>
          <feMergeNode in="borderGlow"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      
      <!-- Text glow filter -->
      <filter id="text-glow-GitHub" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2" result="textBlur"/>
        <feFlood flood-color="#F0F6FC" flood-opacity="0.8" result="textGlow"/>
        <feComposite in="textGlow" in2="textBlur" operator="in" result="glowedText"/>
        <feMerge>
          <feMergeNode in="glowedText"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
  
  <!-- Animated Background with breathing border -->
  <rect x="0" y="0" width="300" height="80" 
        rx="12" ry="12"
        fill="#0D1117" 
        stroke="#181717" 
        stroke-width="2"
        stroke-opacity="0.3"
        filter="url(#border-glow-GitHub)">
    
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;4;2" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Skill Name (Left) -->
  <text x="20" y="45" 
        style="font-family: Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: bold; 
               fill: #F0F6FC;"
        filter="url(#text-glow-GitHub)">
    GitHub
  </text>
  
  <!-- Skill Icon (Center) with breathing glow -->
  <g transform="translate(150, 40)">
    <image x="-20" y="-20" width="40" height="40" 
           href="data:image/png;base64,"
           filter="url(#icon-breathing-glow-GitHub)">
      
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </image>
  </g>
  
  <!-- Rating Text (Right) -->
  <text x="280" y="32" text-anchor="end"
        style="font-family: Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: bold; 
               fill: #7C3AED;">
    8/10
  </text>
  
  <!-- Star Rating (Right, below rating) -->
  <text x="280" y="52" text-anchor="end"
        style="font-family: Segoe UI, Arial, sans-serif; font-size: 12px; 
               fill: #181717;">
    ★★★★★
  </text>
  
  <!-- Animated color accent bar (Left edge) -->
  <rect x="0" y="0" width="4" height="80" 
        rx="2" ry="2" fill="#181717" opacity="0.5">
    
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="4;6;4" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  
</svg>