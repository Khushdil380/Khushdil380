name: Update Contribution Graph

on:
  schedule:
    - cron: "30 0 * * *"  # daily at 00:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch contributions JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: Khushdil380
        run: |
          python src/githubcontribution/fetch_contributions.py

      - name: Generate contribution SVG
        env:
          GH_LOGIN: Khushdil380
        run: |
          python src/githubcontribution/generate_graph.py

      - name: Commit and push changes
        run: |
          if git diff --quiet --exit-code assets/contributiongraph/contrib_graph.svg; then
            echo "No changes to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributiongraph/contrib_graph.svg src/githubcontribution/contrib.json || true
          git commit -m "chore: update contribution graph [skip ci]"
          git push
