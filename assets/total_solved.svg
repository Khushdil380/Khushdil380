<svg xmlns="http://www.w3.org/2000/svg" width="220" height="40">
      <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#4CAF50">
            <animate attributeName="stop-color" values="#4CAF50;#22223b;#4CAF50" dur="2s" repeatCount="indefinite" />
          </stop>
          <stop offset="100%" stop-color="#22223b">
            <animate attributeName="stop-color" values="#22223b;#4CAF50;#22223b" dur="2s" repeatCount="indefinite" />
          </stop>
        </linearGradient>
      </defs>
      <rect rx="8" width="220" height="40" fill="url(#grad1)" />
      <text x="50%" y="50%" font-size="16" font-family="Verdana" fill="#fff" opacity="0"
        text-anchor="middle" dominant-baseline="middle">
        Total Solved: <tspan font-weight="bold">1</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze" />
      </text>
    </svg>
    