<svg viewBox="0 0 1440 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bfff" />
      <stop offset="100%" stop-color="#1e90ff" />
    </linearGradient>

    <style>
      <![CDATA[
        .letter {
          font-size: 48px;
          fill: white;
          font-weight: bold;
          opacity: 0;
          animation: appear 0.5s forwards;
        }

        @keyframes appear {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }

        /* Delays for each letter */
        .l1 { animation-delay: 0.3s; }
        .l2 { animation-delay: 0.6s; }
        .l3 { animation-delay: 0.9s; }
        .l4 { animation-delay: 1.2s; }
        .l5 { animation-delay: 1.5s; }
        .l6 { animation-delay: 1.8s; }
        .l7 { animation-delay: 2.1s; }
        .l8 { animation-delay: 2.4s; }
        .l9 { animation-delay: 2.7s; }
        .l10 { animation-delay: 3s; }
        .l11 { animation-delay: 3.3s; }
        .l12 { animation-delay: 3.6s; }
        .l13 { animation-delay: 3.9s; }
      ]]>
    </style>
  </defs>

  <!-- Wave Layers -->
  <path fill="url(#waveGradient)" fill-opacity="0.3">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="
        M0,160 C400,100 1040,220 1440,180 L1440,420 L0,420 Z;
        M0,180 C360,200 1080,120 1440,160 L1440,420 L0,420 Z;
        M0,160 C400,100 1040,220 1440,180 L1440,420 L0,420 Z
      " />
  </path>

  <path fill="url(#waveGradient)" fill-opacity="0.5">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
        M0,200 C360,160 1080,160 1440,200 L1440,420 L0,420 Z;
        M0,180 C400,180 1040,140 1440,180 L1440,420 L0,420 Z;
        M0,200 C360,160 1080,160 1440,200 L1440,420 L0,420 Z
      " />
  </path>

  <path fill="url(#waveGradient)" fill-opacity="0.8">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,180 C320,220 1120,140 1440,160 L1440,420 L0,420 Z;
        M0,160 C360,180 1080,200 1440,180 L1440,420 L0,420 Z;
        M0,180 C320,220 1120,140 1440,160 L1440,420 L0,420 Z
      " />
  </path>

  <!-- Full Name in One Line -->
  <g font-family="Verdana, sans-serif" text-anchor="middle">
    <!-- Letters appear one by one horizontally centered -->
    <text x="32%" y="120" class="letter l1">K</text>
    <text x="36%" y="120" class="letter l2">H</text>
    <text x="40%" y="120" class="letter l3">U</text>
    <text x="44%" y="120" class="letter l4">S</text>
    <text x="48%" y="120" class="letter l5">H</text>
    <text x="52%" y="120" class="letter l6">D</text>
    <text x="56%" y="120" class="letter l7">I</text>
    <text x="60%" y="120" class="letter l8">L</text>
    <text x="64%" y="120" class="letter l9"> </text>
    <text x="68%" y="120" class="letter l10">A</text>
    <text x="72%" y="120" class="letter l11">N</text>
    <text x="76%" y="120" class="letter l12">S</text>
    <text x="80%" y="120" class="letter l13">A</text>
    <text x="84%" y="120" class="letter l13">R</text>
    <text x="88%" y="120" class="letter l13">I</text>
  </g>
</svg>
