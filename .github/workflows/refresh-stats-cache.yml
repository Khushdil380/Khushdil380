name: Refresh stats cache

on:
  schedule:
    - cron: "27 3 * * *" # Daily at 03:27 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh cache-busting
        run: node ./src/githubstate/refresh-stats-cache.js

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit.";
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh stats cache-busting params"
            git push
          fi
