name: Update Coding Platform Stats

on:
  schedule:
    - cron: "15 1 * * *" # daily at 01:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch platform stats
        env:
          LC_USER: Khushdil380
          GFG_USER: khushdilazqaz
          CF_USER: Khushdil380
        run: |
          python src/codingplatform/fetch_platform_stats.py

      - name: Render SVG cards
        run: |
          python src/codingplatform/render_platform_cards.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/coding-platform/*.svg assets/coding-platform/stats.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"; exit 0; fi
          git commit -m "chore: update coding platform stats [skip ci]"
          git push
