
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="50">
  <defs>
    <linearGradient id="socialGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0077B5" />
      <stop offset="100%" stop-color="#222" />
    </linearGradient>
    <filter id="socialShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0077B5" flood-opacity="0.7"/>
    </filter>
  </defs>
  <style>
    .badge-bg {
      fill: url(#socialGradient);
      rx: 25;
      filter: url(#socialShadow);
      transition: filter 0.3s;
    }
    .icon {
      filter: drop-shadow(0 0 6px #0077B5);
    }
    .label {
      fill: #fff;
      font-size: 16px;
      font-family: 'Segoe UI', Verdana, sans-serif;
      font-weight: bold;
      dominant-baseline: middle;
      text-anchor: start;
      letter-spacing: 1px;
    }
    .badge-bg:hover {
      filter: url(#socialShadow) brightness(1.2);
    }
  </style>
  <a href="https://www.linkedin.com/in/khushdil-ansari/" target="_blank">
    <rect x="0" y="0" width="220" height="50" rx="25" class="badge-bg"/>
    <image href="data:image/png;base64," x="18" y="10" width="30" height="30" class="icon"/>
    <text x="60" y="28" class="label">LinkedIn</text>
  </a>
</svg>
